services:
  - type: web
    name: defectiq
    env: docker
    plan: starter
    region: ohio
    dockerCommand: sh -c "/opt/defectiq-venv/bin/python engine_server.py >/dev/null 2>&1 & sleep 3 && exec node dist/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ENGINE_SECRET
        value: defectiq-internal
      - key: ENGINE_URL
        value: http://127.0.0.1:8901
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OAUTH_SERVER_URL
        sync: false
